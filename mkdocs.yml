site_name: ICS4U Course
site_description: Course notes and lessons for ICS4U
site_author: Angelo

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - def_list
  - footnotes

plugins:
  - search
  - glightbox

extra_css:
  - stylesheets/nav-style.css

extra_javascript:
  - stylesheets/nav-style.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Unit 1 - Getting Started:
      - 1. From ICS3U to ICS4U: unit1/1-intro.md
      - 2. Setting Up Replit: unit1/2-setting-up-replit.md
      - 3. Creating a TypeScript Project: unit1/3-organizing-projects.md
      - "Assignment 1": unit1/3-assignment.md
      - 4. Basic TypeScript Syntax: unit1/4-syntax-basics.md
      - "Assignment 2": unit1/4-assignment-2.md
  - Unit 2 - Review:
      - 1. Hello World & Output (Review): unit2/1-hello-world-output.md
      - "- Exercise 1": unit2/1-exercise-hello-world-output.md
      # - 2. Data Types, Variables, & Errors (Review): unit2/2-data-types-variables-errors.md
      # - "- Exercise 2": unit2/2-exercise-data-types-variables-errors.md
      # - 3. Input, BEDMAS, & Decimal Output (Review): unit2/3-input-bedmas-decimal-output.md
      # - "- Exercise 3": unit2/3-exercise-input-bedmas-decimal-output.md
      # - 4. Strings (Review): unit2/4-strings.md
      # - "- Exercise 4": unit2/4-exercise-strings.md
      # - "Assignment 1": unit2/4-assignment-1.md
      # - 5. Selection - If-Statements & Try-Catch: unit2/5-selection-if-trycatch.md
      # - "- Exercise 5": unit2/5-exercise-selection-trycatch.md
      # - 6. Repetition - Loops (Review): unit2/6-repetition-loops.md
      # - "- Exercise 6": unit2/6-exercise-repetition-loops.md
      # - 7. Input-Output Files & Algorithms: unit2/7-files-algorithms.md
      # - "- Exercise 7": unit2/7-exercise-files-algorithms.md
      # - "Assignment 2": unit2/7-assignment-2.md

# To fully hide a page from the built site (not just the nav), list it
# here. This returns a 404 for that page's URL entirely.
exclude_docs: |
  # unit1/2-computing-environment.md
  # unit1/2-assignment-1.md
  # unit1/3-what-is-binary.md
  # unit1/3-assignment-2.md
  # unit1/4-setting-up-replit.md
  # unit1/5-organizing-projects.md
  # unit1/5-assignment-3.md
  # unit1/6-supplementary-stackblitz.md
  # unit1/7-supplementary-stackblitz-typescript-project.md
  # unit2/1-hello-world-output.md
  # unit2/1-exercise-hello-world-output.md
  unit2/2-data-types-variables-errors.md
  unit2/2-exercise-data-types-variables-errors.md
  unit2/3-input-bedmas-decimal-output.md
  unit2/3-exercise-input-bedmas-decimal-output.md
  unit2/4-strings.md
  unit2/4-exercise-strings.md
  unit2/4-assignment-1.md
  unit2/5-selection-if-trycatch.md
  unit2/5-exercise-selection-trycatch.md
  unit2/6-repetition-loops.md
